name: stoned-goose-hub

services:
  # ---------------------------------------------------------------------------
  # Phase A — Twenty (primary CRM)
  # ---------------------------------------------------------------------------

  server:
    image: twentycrm/twenty:${TAG:-v2.8.3}
    volumes:
      - twenty-storage:/app/packages/twenty-server/.local-storage
    ports:
      - "3000:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@db:5432/default
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  worker:
    image: twentycrm/twenty:${TAG:-v2.8.3}
    volumes:
      - twenty-storage:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@db:5432/default
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - twenty-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase B — Documenso (e-signature, port 3002) + Mailpit (dev SMTP)
  # ---------------------------------------------------------------------------

  documenso-db:
    image: postgres:15
    volumes:
      - documenso-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_DB_PASSWORD:-documenso}
    healthcheck:
      test: pg_isready -U documenso -d documenso
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  documenso:
    image: documenso/documenso:${DOCUMENSO_TAG:-v2.11.0}
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_WEBAPP_URL:-http://localhost:3002}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:3002
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${DOCUMENSO_DB_PASSWORD:-documenso}@documenso-db:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mailpit
      NEXT_PRIVATE_SMTP_PORT: "1025"
      NEXT_PRIVATE_SMTP_USERNAME: dev
      NEXT_PRIVATE_SMTP_PASSWORD: dev
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_UNSAFE_IGNORE_TLS: "true"
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_FROM_NAME:-Stoned Goose Hub}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_FROM_ADDRESS:-no-reply@stonedgoose.local}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_CERT_PASSPHRASE:-documenso}
    volumes:
      - ./documenso-cert/cert.p12:/opt/documenso/cert.p12:ro
    depends_on:
      documenso-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI for inspecting captured emails
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase B — Webhook glue
  # ---------------------------------------------------------------------------

  documenso-webhook:
    build:
      context: ../integrations
      dockerfile: documenso-webhook/Dockerfile
    environment:
      PORT: 3003
      TWENTY_API_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      DOCUMENSO_WEBHOOK_SECRET: ${DOCUMENSO_WEBHOOK_SECRET}
    ports:
      - "3003:3003"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  twenty-db:
  twenty-storage:
  documenso-db:
